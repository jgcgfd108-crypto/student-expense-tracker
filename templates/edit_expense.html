<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/edit_expense.css') }}">

</head>

<body>

    <div class="edit-container">

        <div class="edit-card">

            <p class="small-title">
                EXPENSE MANAGEMENT
            </p>

            <h1>
                Edit Expense
            </h1>

            <p class="subtitle">
                Update your expense details
            </p>


            <form method="POST">

                <label>
                    Description
                </label>

                <input
                    type="text"
                    name="title"
                    value="{{ expense['description'] }}"
                    required>


                <label>
                    Category
                </label>

                <select name="category" required>

                    <option value="Food"
                        {% if expense['category'] == 'Food' %}
                        selected
                        {% endif %}>
                        Food
                    </option>

                    <option value="Travel"
                        {% if expense['category'] == 'Travel' %}
                        selected
                        {% endif %}>
                        Travel
                    </option>

                    <option value="Education"
                        {% if expense['category'] == 'Education' %}
                        selected
                        {% endif %}>
                        Education
                    </option>

                    <option value="Shopping"
                        {% if expense['category'] == 'Shopping' %}
                        selected
                        {% endif %}>
                        Shopping
                    </option>

                    <option value="Other"
                        {% if expense['category'] == 'Other' %}
                        selected
                        {% endif %}>
                        Other
                    </option>

                </select>


                <label>
                    Amount
                </label>

                <input
                    type="number"
                    name="amount"
                    value="{{ expense['amount'] }}"
                    step="0.01"
                    required>


                <label>
                    Date
                </label>

                <input
                    type="date"
                    name="date"
                    value="{{ expense['date'] }}"
                    required>


                <button type="submit">
                    💾 Save Changes
                </button>

            </form>


            <a href="{{ url_for('view_expense') }}"
               class="back-btn">

                ← Back to Expenses

            </a>

        </div>

    </div>

</body>

</html>
