<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ExpenseTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

    <div class="login-container">

        <!-- Logo -->

        <div class="logo">
            💰 Expense<span>Track</span>
        </div>


        <!-- Heading -->

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to manage your finances
        </p>


        <!-- Login Form -->

        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>


        <!-- Register -->

        <p class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>


        <!-- Back Home -->

        <a
            href="{{ url_for('home') }}"
            class="back-home">

            ← Back to Home

        </a>

    </div>

</body>

</html>
