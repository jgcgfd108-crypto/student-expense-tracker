<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense - ExpenseTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/add_expense.css') }}">

</head>

<body>

    <div class="expense-container">

        <div class="expense-card">

            <!-- Header -->

            <div class="page-icon">
                💸
            </div>

            <h1>Add Expense</h1>

            <p class="subtitle">
                Record your spending and stay in control
            </p>


            <!-- Form -->

            <form method="POST">

                <!-- Description -->

                <div class="form-group">

                    <label for="title">
                        Expense Description
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Example: Lunch, Bus Ticket"
                        required
                    >

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            🍔 Food
                        </option>

                        <option value="Travel">
                            🚌 Travel
                        </option>

                        <option value="Shopping">
                            🛍️ Shopping
                        </option>

                        <option value="Education">
                            📚 Education
                        </option>

                        <option value="Entertainment">
                            🎮 Entertainment
                        </option>

                        <option value="Other">
                            📦 Other
                        </option>

                    </select>

                </div>


                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <div class="amount-input">

                        <span>₹</span>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            placeholder="0.00"
                            min="1"
                            step="0.01"
                            required
                        >

                    </div>

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="expense-btn">

                    Add Expense

                </button>

            </form>


            <!-- Back -->

            <a
                href="{{ url_for('dashboard') }}"
                class="back-btn">

                ← Back to Dashboard

            </a>

        </div>

    </div>

</body>

</html>
