<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker - Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>

<body>

    <div class="dashboard">

        <h1>
            Welcome, {{ username }} 👋
        </h1>

        <h2>
            Student Expense Tracker
        </h2>

        <p>
            Manage your daily expenses easily
        </p>
        <div class="summary">

    <div class="summary-card">

        <h3>💸 Total Expense</h3>

        <p>
            ₹{{ total_expense }}
        </p>

    </div>


    <div class="summary-card">

        <h3>📊 Total Transactions</h3>

        <p>
            {{ expense_count }}
        </p>

    </div>

</div>


        <div class="menu">

            <a href="{{ url_for('add_expense') }}">
                ➕ Add Expense
            </a>


            <a href="{{ url_for('view_expense') }}">
                📊 View Expenses
            </a>


            <a href="{{ url_for('profile') }}">
                👤 Profile
            </a>


            <a class="logout"
               href="{{ url_for('logout') }}">
                🚪 Logout
            </a>

        </div>

    </div>

</body>

</html>
