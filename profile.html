<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - ExpenseTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/profile.css') }}">

</head>

<body>

    <div class="profile-page">

        <div class="profile-card">

            <div class="profile-header">

                <div class="avatar">
                    {{ user["username"][0]|upper }}
                </div>

                <div>

                    <p class="small-title">
                        ACCOUNT PROFILE
                    </p>

                    <h1>
                        {{ user["username"] }}
                    </h1>

                    <p class="profile-subtitle">
                        Manage your personal information
                    </p>

                </div>

            </div>


            <div class="profile-details">

                <div class="detail-box">

                    <span class="detail-label">
                        Username
                    </span>

                    <strong>
                        {{ user["username"] }}
                    </strong>

                </div>


                <div class="detail-box">

                    <span class="detail-label">
                        Email Address
                    </span>

                    <strong>
                        {{ user["email"] }}
                    </strong>

                </div>


                <div class="detail-box">

                    <span class="detail-label">
                        Account Status
                    </span>

                    <strong class="active">
                        ● Active
                    </strong>

                </div>

            </div>


            <a href="{{ url_for('dashboard') }}"
               class="back-btn">

                ← Back to Dashboard

            </a>

        </div>

    </div>

</body>

</html>
